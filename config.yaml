data:
  price_path: "data/raw_prices.parquet"
  force_download: false
  use_sp500: true
  etfs:
    - SPY
    - QQQ
    - VOO
  tickers:
    - SPY
    - QQQ
    - VOO
    - NVDA
    - MSFT
    - AAPL
  start_date: "2018-01-01"
  end_date: "2026-08-01"

features:
  lags: [1, 2, 3, 5, 10, 21]
  vol_windows: [5, 10, 20]
  zscore_windows: [5, 10, 20]
  rsi_windows: [14]

target:
  type: volatility
  horizons: [5]

model:
  name: xgb
  train_size: 252
  test_size: 21
  step: null

position_sizing:
  target_vol: 0.15
  max_leverage: 2.0

backtest:
  cost_bps: 5.0
  periods_per_year: 252

output:
  run_name: baseline_xgb_vol5d